<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DB Prompter</title>
  <script>
    // Apply the stored theme before first paint to avoid a flash.
    (function () {
      try {
        var stored = localStorage.getItem('dbp-theme');
        var dark = stored ? stored === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/static/vendor/codemirror.min.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/vendor/htmx.min.js"></script>
  <script defer src="/static/vendor/alpine.min.js"></script>
  <script src="/static/vendor/codemirror.min.js"></script>
  <script src="/static/vendor/cm-sql.min.js"></script>
</head>
<body>
  <nav class="topnav">
    <div class="brand"><span class="brand-mark">◈</span> DB&nbsp;Prompter</div>
    <div class="tabs">
      <a href="/connections" class="tab {{if eq .Active "connections"}}active{{end}}">Connections</a>
      <a href="/explorer" class="tab {{if eq .Active "explorer"}}active{{end}}">Explorer</a>
      <a href="/ai" class="tab {{if eq .Active "ai"}}active{{end}}">Query</a>
      <a href="/settings" class="tab {{if eq .Active "settings"}}active{{end}}">Settings</a>
    </div>
    <button type="button" class="theme-toggle" id="theme-toggle"
      aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
      </svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
      </svg>
    </button>
  </nav>
  <main class="container">
    {{template "content" .}}
  </main>
  <script>
    (function () {
      var root = document.documentElement;
      document.getElementById('theme-toggle').addEventListener('click', function () {
        var dark = root.classList.toggle('dark');
        try { localStorage.setItem('dbp-theme', dark ? 'dark' : 'light'); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
